name: Build & Release

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    # Commits made by this workflow use GITHUB_TOKEN and normally do not
    # retrigger workflows, but keep an explicit guard to prevent release loops.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and bump release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          CURRENT_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"

          if [ -z "$CURRENT_VERSION" ] || [ -z "$CURRENT_CODE" ]; then
            echo "Could not determine versionName/versionCode from app/build.gradle.kts" >&2
            exit 1
          fi

          CURRENT_TAG="v$CURRENT_VERSION"
          VERSION="$CURRENT_VERSION"
          CODE="$CURRENT_CODE"
          TARGET_SHA="$GITHUB_SHA"

          # If the checked-in version has already shipped, this is an ordinary
          # main update/merge. Automatically advance the patch version and
          # Android versionCode before building the release.
          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            if [[ "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[4]:-0}"
            else
              echo "versionName '$CURRENT_VERSION' is not X.Y or X.Y.Z; refusing to guess the next release" >&2
              exit 1
            fi

            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            CODE="$((CURRENT_CODE + 1))"

            sed -i -E "s/^([[:space:]]*)versionCode = [0-9]+/\\1versionCode = $CODE/" app/build.gradle.kts
            sed -i -E "s/^([[:space:]]*)versionName = \"[^\"]+\"/\\1versionName = \"$VERSION\"/" app/build.gradle.kts

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts
            git commit -m "chore(release): bump version to $VERSION"
            git push origin HEAD:main
            TARGET_SHA="$(git rev-parse HEAD)"
          fi

          TAG="v$VERSION"
          APK="icsee-camera-$TAG.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

          echo "Publishing $TAG (versionCode $CODE) at $TARGET_SHA"

      # The committed gradle.properties pins aapt2 to a local ARM/proot toolchain
      # path (see BUILDING_IN_PROOT.md) that does not exist on CI. Drop it so the
      # standard Maven-distributed aapt2 is used on the x86_64 runner.
      - name: Neutralize proot-only aapt2 override
        run: sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease -x test

      - name: Name the artifact
        run: cp app/build/outputs/apk/release/app-release.apk "${{ steps.release.outputs.apk }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.apk }}
          path: ${{ steps.release.outputs.apk }}
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            printf '%s\n' \
              'Release build (assembleRelease). Install directly on an Android device' \
              '(enable "install unknown apps" for your file manager or browser).' \
              ''

            if [ "${{ steps.release.outputs.version }}" = "1.1" ]; then
              printf '%s\n' \
                '### AVTalk phone-to-camera broadcasting' \
                '' \
                'AVTalk is now a verified working feature on compatible cameras with a built-in display/speaker. It sends the Android device camera as H.265 video and microphone audio as G.711 A-law directly to the camera.' \
                '' \
                'Major thanks to @jericjan for reverse-engineering AVTalk, providing the working main.py reference implementation, hardware-testing the Android port, and reporting the client preview rotation bug fixed for this release.' \
                ''
            fi

            printf '%s\n' \
              'Signed with the standard Android debug key so it is sideload-installable;' \
              'swap in a real keystore/signing config to publish through a store.' \
              '' \
              '<sub>♪ ..._that'"'"'s the melody to funkytown_ ♪</sub>'
          } > release-notes.md

          gh release create "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.apk }}" \
            --target "${{ steps.release.outputs.target_sha }}" \
            --title "${{ steps.release.outputs.tag }}" \
            --notes-file release-notes.md \
            --generate-notes
